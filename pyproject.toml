[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wannado-adv"
version = "1.2.0"
description = "AI-native autonomous adversarial red-teaming, Carlini 2.0 auditing, single-file defenses, and certified L2 smoothing across CV, wireless RF, DRL, and tabular models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "JettZ" },
]
keywords = [
    "adversarial-learning",
    "robustness",
    "red-teaming",
    "certified-robustness",
    "deep-learning",
    "wireless-communications",
    "ai-native",
    "ai-ide",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/JietaoZhao/wannado-adv"
Repository = "https://github.com/JietaoZhao/wannado-adv"
Issues = "https://github.com/JietaoZhao/wannado-adv/issues"

[project.scripts]
wannado-adv = "wannado.adv.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wannado*"]
namespaces = true

[tool.setuptools.package-data]
"wannado.adv" = ["py.typed"]
"wannado.adv.catalog" = ["*.json"]
"wannado.adv.agent_kit" = ["*.md", "templates/*.md", "templates/*.mdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 110
